name: Test and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Start from an empty Python environment
        timeout-minutes: 10
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/workshop-startup"
          source "$RUNNER_TEMP/workshop-startup/bin/activate"
          python -c "import importlib.util; assert importlib.util.find_spec('joblib') is None"
          PORT=8010 bash scripts/start.sh > "$RUNNER_TEMP/workshop-startup.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/workshop-startup.log"' EXIT
          for attempt in {1..180}; do
            if curl -fsS http://localhost:8010/health; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then exit 1; fi
            sleep 2
          done
          python scripts/smoke.py --url http://localhost:8010
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/check_notebook.py
      - run: python -m ml.train
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build production image
        run: docker build -t soda-digit-lab:test .
      - name: Verify the packaged service
        shell: bash
        run: |
          docker run -d --name digit-lab -p 8000:8000 soda-digit-lab:test
          trap 'docker logs digit-lab; docker rm -f digit-lab' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8000/health; then break; fi
            sleep 2
          done
          python scripts/smoke.py --url http://localhost:8000
          npm run test:browser
